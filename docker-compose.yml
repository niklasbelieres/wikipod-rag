# Local single-node OpenSearch for development.
# Matches config/dev.yaml (host: localhost, port: 9200, no TLS).
#
# Usage:
#   docker compose up -d
#   curl http://localhost:9200        # sanity check
#   wikipod index                     # build the dev index (WIKIPOD_ENV=dev)
#   wikipod query "climate change"
#
# Not for prod: config/prod.yaml still assumes OpenSearch running on the
# Pi itself, outside this compose file.
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: wikipod-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  opensearch-data:
