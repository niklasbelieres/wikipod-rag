paths:
  zim_file: "data/wikipedia_en.zim"
  pageviews_file: "data/pageviews-aggregated.txt" # produced by `wikipod fetch-pageviews` above
  data_dir: "data"

selection:
  storage_budget_mb: 13000
  weights:
    word_count: 0.15
    link_count: 0.15
    importance: 0.15
    incoming_links: 0.25
    pageviews: 0.3 # enabled here -- requires paths.pageviews_file to exist, see Usage above

opensearch:
  index_name: "wikipod-chunks-server"
